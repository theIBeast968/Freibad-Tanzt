<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .logo-wrap {
      width: 512px;
      height: 512px;
      padding: 24px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, #ff4946, #ffb703, #18a1cc, #ff4946);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15), 0 0 40px rgba(255,183,3,0.25);
    }
    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,183,3,0.25), transparent 68%);
    }
    .logo-wrap {
      position: relative;
    }
    .logo-wrap img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 12px solid #090909;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="Freibad Tanzt Logo Original.png" alt="">
  </div>
</body>
</html>
